<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 텍스트 탐구 실험실</title>
<style>
* { box-sizing: border-box }
body {
  margin: 0; color: #17283a; background: #fafbfc;
  font: 16px/1.75 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: clamp(32px, 8vw, 84px) 20px }
h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 38px); line-height: 1.3; letter-spacing: -.055em }
p { margin: 0 0 32px; color: #536477 }
label, h2 { display: block; margin: 0 0 8px; font-size: 16px; font-weight: 700 }
textarea, .result {
  display: block; width: 100%; min-height: 170px; padding: 17px 19px;
  border: 1px solid #cbd3dc; border-radius: 10px; background: white;
  font: inherit; color: inherit; white-space: pre-wrap; overflow-wrap: anywhere;
}
textarea { resize: vertical }
textarea::placeholder, .result:empty::before { color: #6a7888 }
.result:empty::before { content: "수정한 글이 여기에 표시됩니다." }
button {
  margin: 14px 0 30px; padding: 10px 24px; min-height: 44px;
  border: 0; border-radius: 8px; background: #195799;
  color: white; font: inherit; font-weight: 650; cursor: pointer;
}
button:hover { background: #12457c }
:focus-visible { outline: 3px solid #5192d2; outline-offset: 3px }
button:disabled { background: #dce3eb; color: #536477; cursor: default }
mark { background: #e1efff; color: #164c84; border-radius: 3px; text-decoration: underline }
small { display: block; margin-top: 8px; color: #536477 }
</style>
</head>
<body>
<main>
  <h1>AI 텍스트 탐구 실험실</h1>
  <p>공백 기준으로 다섯 번째마다 유사 표현을 찾아 바꿉니다.</p>
  <label for="source">원문</label>
  <textarea id="source" placeholder="실험할 글을 입력하세요."></textarea>
  <button id="revise" disabled>수정하기</button>
  <h2 id="result-title">수정된 글</h2>
  <div id="result" class="result" role="region" aria-labelledby="result-title"></div>
  <small id="status" role="status"></small>
</main>
<script>
const source = document.querySelector('#source');
const revise = document.querySelector('#revise');
const result = document.querySelector('#result');
const statusLine = document.querySelector('#status');

// 조사가 달라지는 표현은 실제로 쓸 어절을 짝지어 등록한다.
const forms = new Map(Object.entries({
  '데이터': '자료', '데이터를': '자료를', '데이터는': '자료는', '데이터가': '자료가',
  '결과를': '결과물을', '방법': '방식', '방법을': '방식을', '방법은': '방식은',
  '방법으로': '방식으로', '과정': '절차', '특징': '특성', '특징을': '특성을',
  '시스템': '체계', '시스템을': '체계를', '다양한': '여러', '중요한': '주요한',
  '또한': '아울러', '그러나': '하지만', '따라서': '그러므로', '특히': '그중에서도'
}));
const verbPairs = [
  ['사용', '활용'], ['이용', '사용'], ['활용', '이용'],
  ['확인', '점검'], ['설명', '해설'], ['비교', '대조']
];
for (const [from, to] of verbPairs) {
  for (const ending of ['하다','한다','하는','한','할','하면','하며','하고','하여','해서',
    '했다','하였다','합니다','했습니다','하였습니다','하기','하므로','하는데']) {
    forms.set(from + ending, to + ending);
  }
}
function substitute(token) {
  const parts = token.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}]+)([^\p{L}\p{N}]*)$/u);
  if (!parts || !forms.has(parts[2])) return token;
  return parts[1] + forms.get(parts[2]) + parts[3];
}
source.addEventListener('input', () => {
  revise.disabled = !source.value.trim();
  result.replaceChildren();
  statusLine.textContent = '';
});
revise.addEventListener('click', () => {
  const fragment = document.createDocumentFragment();
  let position = 0, changed = 0;
  for (const part of source.value.match(/\s+|\S+/gu) || []) {
    if (/\S/u.test(part)) {
      position++;
      const next = position % 5 === 0 ? substitute(part) : part;
      if (next !== part) {
        const mark = document.createElement('mark');
        mark.textContent = next;
        mark.title = position + '번째 · 원래 표현 ‘' + part + '’';
        fragment.append(mark);
        changed++;
        continue;
      }
    }
    fragment.append(part);
  }
  result.replaceChildren(fragment);
  statusLine.textContent = changed
    ? changed + '곳 변경 · 파란 밑줄의 표현이 문맥에 맞는지 확인하세요.'
    : position < 5 ? '5단어 미만이라 원문을 그대로 표시했습니다.'
    : '변경 대상에 등록된 유사 표현이 없어 원문을 그대로 표시했습니다.';
});
</script>
</body>
</html>
