<script>
const el = id => document.getElementById(id);
const rules = new Map();

function pairs(lines) {
  for (const line of lines.trim().split('\n')) {
    const [from,to] = line.split('|');
    rules.set(from,to);
  }
}

pairs(`
결론적으로|결론부터 말하면
단순히|그저
또한|아울러
그러나|하지만
따라서|그러므로
만약에|만일
매우|무척
서로 간에|서로
다시 한 번 더|다시 한 번
예를 들면|예를 하나 들면
이 경우|이 경우에
이 경우에는|이 경우엔
그중에서도|그중
다양한|여러
중요한|주요한
점차적으로|점차
대부분의 경우|대개
승패를 가르는|승패를 결정짓는
이해하시면 됩니다|이해할 수 있습니다
그뿐만 아니라|그뿐 아니라
할 수 있기 때문에|할 수 있으므로
그 이유는 바로|그 이유는
`);

// 왼쪽 명사와 오른쪽 명사의 받침에 맞게 조사도 맞춘다.
const nouns = [
  ['데이터','자료'],['방법','방식'],['특징','특성'],
  ['과정','절차'],['시스템','체계'],['요소','요인'],['전투','싸움'],
  ['차이점','차이'],['관점','시각'],['까닭','이유']
];

function particle(noun,pair) {
  const tail=(noun.charCodeAt(noun.length-1)-44032)%28;
  return pair.split('/')[tail && !(pair==='으로/로' && tail===8)?0:1];
}

for (const [a,b] of nouns) {
  for (const suffix of ['', '의','에','에서','까지','부터','에도','에서는']) {
    rules.set(a+suffix,b+suffix);
  }
  for (const pair of ['이/가','은/는','을/를','과/와','으로/로','이라고/라고']) {
    rules.set(a+particle(a,pair),b+particle(b,pair));
  }
  rules.set(a+'에 대해',b+'에 관해');
}

for (const [a,b] of [
  ['사용','활용'],['이용','사용'],['활용','이용'],['확인','점검'],
  ['비교','대조'],['설명','해설'],['선택','채택'],['시작','개시'],['종료','마무리']
]) {
  for (const end of '하다 한다 하는 한 할 하면 하며 하고 하여 해서 했다 하였다 합니다 했습니다 하였습니다 하기 하므로 하는데 하거나 하면서 합니다만'.split(' ')) {
    rules.set(a+end,b+end);
  }
}

const escapeRE = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
pairs(`
이렇게 생각하면|이렇게 보면
시각적으로|눈으로
기억하기에는|기억하는 데는
꽤|제법
그리고|또
첫째|첫 번째로
둘째|두 번째로
아주 긴 시간 동안|매우 오랜 시간에 걸쳐
천천히|느리게
고체이지|고체야
튀어 오르지만|튀어 오르는 반면
이에 대해서는|이에 관해서는
이에 대해|이에 관해
이를 통해|이것을 통해
이러한|이와 같은
그러한|그와 같은
이처럼|이와 같이
그처럼|그와 같이
즉|다시 말해
예컨대|예를 들어
예를 들어|한 예로
다시 말해서|다시 말해
바꾸어 말하면|달리 말하면
결과적으로|그 결과
일반적으로|대체로
구체적으로|구체적으로 말하면
전체적으로|전반적으로
지속적으로|꾸준히
점진적으로|점차
동시에|이와 동시에
결국에는|결국
사실상|실질적으로
스스로|자신의 힘으로
왜냐하면|그 까닭은
굉장히|매우
대단히|매우
상당히|꽤
충분히|넉넉히
빠르게|신속하게
정확하게|정확히
명확하게|명확히
적절하게|적절히
분명하게|분명히
자세하게|상세히
신중하게|신중히
간단하게|간단히
자연스럽게|자연스레
함께 같이|함께
가장 최선의|최선의
미리 사전에|미리
다시 재차|다시
먼저 우선|우선
각각마다|각각
하는 것이라고|하는 것이라
하는 것이|하는 게
할 것이|할 게
하는 것을|하는 걸
할 것을|할 걸
하는 것은|하는 건
할 것은|할 건
것입니다|것이에요
것이다|것이야
할 필요가 있다|해야 한다
할 필요가 있습니다|해야 합니다
할 수 있다는 것이다|할 수 있다는 뜻이다
할 수 있다는 점이다|할 수 있다는 것이다
에 의해서|에 의해
에 있어서|에서
에 관하여|에 관해
에 대하여|에 대해
`);

function compileRules(localRules) {
  const keys=[...localRules.keys()].sort((a,b)=>b.length-a.length);
  const pattern=keys.map(s=>s.split(' ').map(escapeRE).join('[ \\t]+')).join('|');
  return new RegExp('(?<![\\p{L}\\p{N}_])(?:'+pattern+')(?![\\p{L}\\p{N}_])','gu');
}

function protectedText(text,names) {
  const mask=new Uint8Array(text.length);
  for (const m of text.matchAll(/“[^”]*”|‘[^’]*’|「[^」]*」|『[^』]*』|"[^"\n]*"|'[^'\n]*'|《[^》]*》|https?:\/\/[^\s]+/gu)) {
    mask.fill(1,m.index,m.index+m[0].length);
  }
  for (const name of new Set(
    ['블리치','영압',...names.split(/[,\n]/)].map(s=>s.trim()).filter(Boolean)
  )) {
    let start=0;
    while ((start=text.indexOf(name,start))!==-1) {
      mask.fill(1,start,start+name.length);
      start+=name.length;
    }
  }
  return mask;
}

function rewrite(text,names,additions=[]) {
  const localRules=new Map([...additions,...rules]);
  const matcher=compileRules(localRules);
  const mask=protectedText(text,names), pieces=[];
  let cursor=0;
  for (const m of text.matchAll(matcher)) {
    const end=m.index+m[0].length;
    if (mask.subarray(m.index,end).includes(1)) continue;
    pieces.push(
      {text:text.slice(cursor,m.index)},
      {text:localRules.get(m[0].replace(/[ \t]+/g,' ')),original:m[0]}
    );
    cursor=end;
  }
  pieces.push({text:text.slice(cursor)});
  return pieces;
}

let hasChanges=false;
function clearResult() {
  hasChanges=true;
  el('revise').disabled=!el('source').value.trim();
  el('result').replaceChildren();
  el('status').textContent='';
}

for (const id of ['source','names']) el(id).addEventListener('input',clearResult);

el('revise').onclick=async()=>{
  if(window.transforming)return;
  window.transforming=true;
  el('source').readOnly=el('names').readOnly=true;
  el('revise').disabled=true;
  const sourceSnapshot=el('source').value, namesSnapshot=el('names').value;
  const additions=[];
  let dictionaryMessage='사전 연결 전 · 기본 표현 규칙 적용';
  if(window.dictionaryLookup) {
    el('revise').disabled=true;
    el('status').textContent='사전에서 유사 표현을 찾고 있습니다…';
    try {
      const result=await window.dictionaryLookup(sourceSnapshot,namesSnapshot);
      additions.push(...result.additions);
      dictionaryMessage=result.message;
    } catch {
      dictionaryMessage='사전 조회 실패 · 기본 표현 규칙 적용';
    }
  }
  window.transforming=false;
  el('source').readOnly=el('names').readOnly=false;
  el('revise').disabled=false;
  if(sourceSnapshot!==el('source').value || namesSnapshot!==el('names').value)return;

  hasChanges=true;
  const fragment=document.createDocumentFragment();
  let count=0;
  for (const part of rewrite(sourceSnapshot,namesSnapshot,additions)) {
    if (!part.original) {
      fragment.append(part.text);
      continue;
    }
    const mark=document.createElement('mark');
    mark.textContent=part.text;
    mark.title='원래 표현: '+part.original;
    fragment.append(mark);
    count++;
  }
  el('result').replaceChildren(fragment);
  el('status').textContent=count
    ? count+'곳 변경 · '+dictionaryMessage+' · 의미를 확인하세요.'
    : dictionaryMessage+' · 의미를 유지할 수 있는 변경 규칙을 찾지 못했습니다.';
  window.dispatchEvent(new Event('rewrite-complete'));
};
</script>


<script type="module">
// Supabase 프로젝트의 공개 연결 정보만 입력하세요.
const SUPABASE_URL = 'https://txwriuyoctzkcvcylffb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cPMZ3zGQ8acQJ2VijuP94w_QcjsorGf';
const get = id => document.getElementById(id);
let db, user, signup=false, checked='', current=null, cursor=null, busy=false;
const accountPattern=/^[a-z0-9_]{4,20}$/;
const username=()=>get('username').value.trim().toLowerCase();
const address=id=>id+'@accounts.ai-text-lab.invalid';
const notice=(id,message)=>{get(id).textContent=message};
function accountMode() {
  get('signupExtra').hidden=!signup;
  get('passwordAgain').required=signup;
  get('password').autocomplete=signup?'new-password':'current-password';
  get('submitAccount').textContent=signup?'회원가입':'로그인';
  get('switchAccount').textContent=signup?'로그인으로 돌아가기':'회원가입하기';
  notice('authStatus','');
}
get('switchAccount').onclick=()=>{signup=!signup;accountMode()};
get('username').oninput=()=>{checked='';notice('authStatus','')};
async function action(target,fn) {
  if(busy || window.transforming)return;
  busy=true;
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  try { await fn() }
  catch(e) { notice(target,e.message || '연결에 실패했습니다. 다시 시도하세요.') }
  finally {
    busy=false;
    document.querySelectorAll('button').forEach(b=>b.disabled=false);
    get('revise').disabled=!get('source').value.trim();
  }
}
function validId() {
  const id=username();
  if(!accountPattern.test(id))throw Error('아이디는 영문·숫자·밑줄 4~20자로 입력하세요. 대소문자는 구분하지 않습니다.');
  return id;
}
get('checkId').onclick=()=>action('authStatus',async()=>{
  if(!db)throw Error('먼저 Supabase 연결 설정이 필요합니다.');
  const id=validId();
  const {data,error}=await db.rpc('lab_username_available',{candidate:id});
  if(error)throw Error('중복 확인 실패. 연결과 데이터베이스 설정을 확인하세요.');
  checked=data?id:'';
  notice('authStatus',data?'사용 가능한 아이디입니다.':'이미 사용 중인 아이디입니다.');
});

window.dictionaryLookup=async(text,names)=>{
  if(!db || !user)throw Error('로그인이 필요합니다.');
  const mask=protectedText(text,names),candidates=[];
  for(const m of text.matchAll(/[가-힣]{2,20}/gu)) {
    if(mask.subarray(m.index,m.index+m[0].length).includes(1))continue;
    candidates.push(m[0]);
  }
  const unique=[...new Set(candidates)];
  const selected=unique.slice(0,24),additions=[];
  let count=0;
  for(let start=0;start<selected.length;start+=8) {
    const {data,error}=await db.functions.invoke('dictionary-lookup',{body:{words:selected.slice(start,start+8)}});
    if(error)throw error;
    for(const item of data.items) {
      if(item.replacement && item.word!==item.replacement) {
        additions.push([item.word,item.replacement]);count++;
      }
    }
  }
  get('dictionaryCredit').hidden=false;
  return {additions,message:'사전 후보 '+count+'개 확인'+(unique.length>24?' · 처음 24개 어절 조회':'')};
};

get('accountForm').onsubmit=e=>{
  e.preventDefault();
  action('authStatus',async()=>{
    if(!db)throw Error('먼저 Supabase 연결 설정이 필요합니다.');
    const id=validId(),password=get('password').value;
    if(signup && checked!==id)throw Error('아이디 중복 확인을 먼저 눌러주세요.');
    if(signup && password!==get('passwordAgain').value)throw Error('두 비밀번호가 다릅니다.');
    const credentials={email:address(id),password};
    const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);
    if(error)throw Error(signup?'가입 실패. 아이디 중복·비밀번호 설정·가입 요청 제한을 확인하세요.':'로그인 실패. 아이디와 비밀번호를 확인하세요.');
    if(!data.session)throw Error('Supabase에서 이메일 확인 설정을 꺼야 아이디로 가입할 수 있습니다.');
    get('password').value=get('passwordAgain').value='';
    hasChanges=false;
    await showSession(data.session);
  });
};
function discard() { return !hasChanges || confirm('저장하지 않은 변경을 지우고 이동할까요?') }
function reset() {
  current=null;
  get('source').value=get('names').value='';
  clearResult();
  hasChanges=false;
  notice('saveStatus','새 기록');
}
async function showSession(session) {
  user=session?.user||null;
  get('accountGate').hidden=!!user;
  get('application').hidden=!user;
  get('history').replaceChildren();
  reset();
  if(!user)return;
  get('accountName').textContent=user.email.split('@')[0]+'님의 실험실';
  await loadHistory(true);
}
get('signout').onclick=()=>action('saveStatus',async()=>{
  if(!discard())return;
  const {error}=await db.auth.signOut({scope:'local'});
  if(error)throw Error('로그아웃에 실패했습니다. 다시 시도하세요.');
  await showSession(null);
});
get('newRecord').onclick=()=>{if(discard())reset()};
get('reloadRecords').onclick=()=>action('saveStatus',()=>loadHistory(true));
get('moreRecords').onclick=()=>action('saveStatus',()=>loadHistory(false));
async function loadHistory(first) {
  let query=db.from('lab_history').select('id,title,updated_at').order('id',{ascending:false}).limit(30);
  if(!first && cursor)query=query.lt('id',cursor);
  const {data,error}=await query;
  if(error)throw Error('기록 목록을 불러오지 못했습니다. 로그인 상태와 연결을 확인하세요.');
  if(first)get('history').replaceChildren();
  for(const row of data) {
    const entry=document.createElement('article'),button=document.createElement('button'),date=document.createElement('small');
    button.textContent=row.title;
    button.onclick=()=>action('saveStatus',async()=>{
      if(!discard())return;
      const {data,error}=await db.from('lab_history').select('*').eq('id',row.id).single();
      if(error)throw Error('기록을 열지 못했습니다. 목록을 새로고침하세요.');
      current=data;
      get('source').value=data.source;
      get('names').value=data.protected_names;
      clearResult();
      const fragment=document.createDocumentFragment();
      for(const part of data.parts) {
        if(part.original) {
          const mark=document.createElement('mark');
          mark.textContent=part.text;mark.title='원래 표현: '+part.original;fragment.append(mark);
        } else fragment.append(part.text);
      }
      get('result').replaceChildren(fragment);
      hasChanges=false;
      notice('saveStatus','저장된 기록을 열었습니다.');
    });
    date.textContent=new Date(row.updated_at).toLocaleString('ko-KR');
    entry.append(button,date);get('history').append(entry);
  }
  if(first && !data.length)get('history').textContent='저장된 기록이 없습니다.';
  cursor=data.at(-1)?.id||cursor;
  get('moreRecords').hidden=data.length<30;
}
get('saveRecord').onclick=()=>action('saveStatus',async()=>{
  const source=get('source').value;
  if(!source.trim())throw Error('원문을 입력하세요.');
  if(source.length>100000)throw Error('한 기록은 10만 자까지 저장할 수 있습니다.');
  const parts=[...get('result').childNodes].map(node=>node.nodeType===3?{text:node.textContent}:
    {text:node.textContent,original:node.title.replace(/^원래 표현: /,'')});
  const record={
    owner:user.id,title:source.trim().slice(0,50),source,
    protected_names:get('names').value,parts,
    version:(current?.version||0)+1
  };
  let query=current?db.from('lab_history').update(record).eq('id',current.id).eq('version',current.version):
    db.from('lab_history').insert(record);
  const {data,error}=await query.select().single();
  if(error)throw Error('저장에 실패했습니다. 연결을 확인하세요. 다른 기기에서 수정했다면 새 글로 저장해 주세요.');
  current=data;hasChanges=false;
  notice('saveStatus','계정에 저장했습니다.');
  await loadHistory(true);
});
// 수정 버튼의 기존 변환 처리가 끝난 뒤 계정에 자동 저장한다.
window.addEventListener('rewrite-complete',()=>{
  if(user && !busy)get('saveRecord').click();
});
window.addEventListener('beforeunload',event=>{
  if(hasChanges){event.preventDefault();event.returnValue=''}
});
if(!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
  notice('authStatus','계정 기능을 준비 중입니다. Supabase 연결 설정이 필요합니다.');
} else {
  try {
    const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.8');
    db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    await showSession(data.session);
    db.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_OUT' && user)void showSession(null);
    });
  } catch { notice('authStatus','계정 서비스 연결에 실패했습니다. 주소·공개 키·인터넷 연결을 확인하세요.') }
}

</script>
</html>
